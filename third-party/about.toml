# cargo-about 0.9.1 configuration for the native picker shipped in the npm
# package. Keep the target list aligned with the release asset matrix.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

ignore-dev-dependencies = true
ignore-build-dependencies = false
ignore-transitive-dependencies = false
private = { ignore = true }

# These are cargo-about's checksum-backed, upstream-maintained clarifications
# for crates whose packaged license metadata is historically ambiguous.
workarounds = ["cocoa", "gtk", "rustix"]
