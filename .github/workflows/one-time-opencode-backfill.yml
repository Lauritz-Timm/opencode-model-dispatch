name: Stop one-time OpenCode backfill

on:
  push:
    branches:
      - "codex/opencode-1x-backfill-20260730"

permissions:
  contents: read

concurrency:
  group: one-time-opencode-1x-backfill
  cancel-in-progress: true

jobs:
  stop:
    name: Backfill postponed until first release
    runs-on: ubuntu-22.04
    steps:
      - run: echo "The compatibility backfill is postponed until the first plugin release."
