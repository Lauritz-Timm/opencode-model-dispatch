          ' "$tarball")"
          test "$actual_integrity" = "$EXPECTED_PACKAGE_INTEGRITY"
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"
        env:
          EXPECTED_PACKAGE_FILENAME: ${{ needs.npm-package.outputs.filename }}
          EXPECTED_PACKAGE_INTEGRITY: ${{ needs.npm-package.outputs.integrity }}
      - name: Publish with trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          peeled_ref="${tag_ref}^{}"
          remote_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          remote_refs="$(git ls-remote "$remote_url" "$tag_ref" "$peeled_ref")"
          direct_count="$(printf '%s\n' "$remote_refs" |
            awk -v ref="$tag_ref" '$2 == ref { count++ } END { print count + 0 }')"
          peeled_count="$(printf '%s\n' "$remote_refs" |
            awk -v ref="$peeled_ref" '$2 == ref { count++ } END { print count + 0 }')"
          if [ "$direct_count" -ne 1 ] || [ "$peeled_count" -gt 1 ]; then
            echo "Remote release tag $tag_ref is missing or ambiguous" >&2
            exit 1
          fi
          direct_sha="$(printf '%s\n' "$remote_refs" |
            awk -v ref="$tag_ref" '$2 == ref { print $1 }')"
          resolved_sha="$direct_sha"
          if [ "$peeled_count" -eq 1 ]; then
            resolved_sha="$(printf '%s\n' "$remote_refs" |
              awk -v ref="$peeled_ref" '$2 == ref { print $1 }')"
          fi
          if [ "$resolved_sha" != "$GITHUB_SHA" ]; then
            echo "Remote release tag resolves to $resolved_sha, expected $GITHUB_SHA" >&2
            exit 1
          fi

          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "trusted publishing refuses to run while NODE_AUTH_TOKEN is set" >&2
            exit 1
          fi
          npm publish "$PACKAGE_TARBALL" \
            --provenance \
            --access public
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}

  npm-verify:
    name: Verify published npm package
    needs: [npm-package, npm-registry, npm-bootstrap, npm]
    if: >-
      always() &&
      needs.npm-package.result == 'success' &&
      needs.npm-registry.result == 'success' &&
      (needs.npm-bootstrap.result == 'success' || needs.npm-bootstrap.result == 'skipped') &&
      (needs.npm.result == 'success' || needs.npm.result == 'skipped')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-npm-package
          path: ${{ runner.temp }}/npm-package
      - name: Pin npm version used for provenance verification
        run: |
          npm install --global npm@11.18.0
          test "$(npm --version)" = "11.18.0"
      - name: Revalidate the exact npm tarball
        id: package
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_PACKAGE_FILENAME" ] ||
            [ "$(basename -- "$EXPECTED_PACKAGE_FILENAME")" != "$EXPECTED_PACKAGE_FILENAME" ]; then
            echo "npm package artifact has an unsafe filename" >&2
            exit 1
          fi
          case "$EXPECTED_PACKAGE_FILENAME" in
            *.tgz) ;;
            *)
              echo "npm package artifact must be a .tgz file" >&2
              exit 1
              ;;
          esac

          tarball="$RUNNER_TEMP/npm-package/$EXPECTED_PACKAGE_FILENAME"
          test -f "$tarball"
          actual_integrity="$(node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            const digest = createHash("sha512")
              .update(readFileSync(process.argv[1]))
              .digest("base64");
            process.stdout.write("sha512-" + digest);
          ' "$tarball")"
          if [ "$actual_integrity" != "$EXPECTED_PACKAGE_INTEGRITY" ]; then
            echo "Retained npm artifact integrity no longer matches the tested tarball" >&2
            exit 1
          fi

          manifest="$RUNNER_TEMP/npm-verify-package-manifest.json"
          tar -xOf "$tarball" package/package.json > "$manifest"
          package_name="$(node -e '
            const value = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (typeof value.name !== "string") process.exit(1);
            process.stdout.write(value.name);
          ' "$manifest")"
          package_version="$(node -e '
            const value = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (typeof value.version !== "string") process.exit(1);
            process.stdout.write(value.version);
          ' "$manifest")"
          test "$package_name" = "opencode-model-dispatch"
          test "$package_version" = "${RELEASE_TAG#v}"
          {
            printf 'name=%s\n' "$package_name"
            printf 'version=%s\n' "$package_version"
          } >> "$GITHUB_OUTPUT"
        env:
          EXPECTED_PACKAGE_FILENAME: ${{ needs.npm-package.outputs.filename }}
          EXPECTED_PACKAGE_INTEGRITY: ${{ needs.npm-package.outputs.integrity }}
      - name: Verify public npm package and provenance
        shell: bash
        run: |
          set -euo pipefail
          view_error="$RUNNER_TEMP/npm-view-error.log"
          registry_version=""
          registry_integrity=""
          provenance_url=""
          for attempt in {1..12}; do
            if registry_version="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>"$view_error")" &&
              registry_integrity="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" dist.integrity 2>"$view_error")" &&
              provenance_url="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" dist.attestations.url 2>"$view_error")" &&
              [ "$registry_version" = "$PACKAGE_VERSION" ] &&
              [ -n "$registry_integrity" ] &&
              [ -n "$provenance_url" ]; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              cat "$view_error" >&2
              echo "npm registry did not expose complete $PACKAGE_NAME@$PACKAGE_VERSION integrity and provenance metadata" >&2
              exit 1
            fi
            sleep 5
          done

          if [ "$EXPECTED_PACKAGE_INTEGRITY" != "$registry_integrity" ]; then
            echo "published package integrity does not match the exact tested tarball" >&2
            exit 1
          fi

          verify_root="$RUNNER_TEMP/npm-provenance-verification"
          mkdir -p "$verify_root"
          printf '%s\n' '{"name":"npm-provenance-verification","private":true}' > "$verify_root/package.json"
          npm install \
            --ignore-scripts \
            --omit=dev \
            --omit=optional \
            --legacy-peer-deps \
            --prefix "$verify_root" \
            "$PACKAGE_NAME@$PACKAGE_VERSION"
          audit_json="$RUNNER_TEMP/npm-provenance-audit.json"
          npm audit signatures \
            --json \
            --include-attestations \
            --prefix "$verify_root" > "$audit_json"
          bun scripts/verify-npm-provenance.ts \
            "$audit_json" \
            "$PACKAGE_NAME" \
            "$PACKAGE_VERSION" \
            "$EXPECTED_PACKAGE_INTEGRITY" \
            "$GITHUB_REPOSITORY" \
            ".github/workflows/publish.yml" \
            "$GITHUB_REF" \
            "$GITHUB_SHA"
          echo "verified public npm integrity and signed provenance for $PACKAGE_NAME@$PACKAGE_VERSION"
        env:
          EXPECTED_PACKAGE_INTEGRITY: ${{ needs.npm-package.outputs.integrity }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}

  manual-integration:
    name: Require recorded TUI and Desktop evidence
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check:manual-gate

  release:
    name: Publish GitHub release
    needs: [stage-release, npm-verify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-github-assets
          path: expected-release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: release-notes
      - name: Revalidate and publish the draft release
        shell: bash
        run: |
          set -euo pipefail
          release_notes="$RUNNER_TEMP/release-notes/release-notes.md"
          test -s "$release_notes"
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true"

          expected_assets="$(mktemp)"
          actual_assets="$(mktemp)"
          printf '%s\n' \
            LICENSE \
            SHA256SUMS \
            THIRD_PARTY_NOTICES.md \
            picker-linux-arm64 \
            picker-linux-x64 \
            picker-macos-arm64 \
            picker-windows-arm64.exe \
            picker-windows-x64.exe |
            LC_ALL=C sort > "$expected_assets"
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' |
            LC_ALL=C sort > "$actual_assets"
          diff -u "$expected_assets" "$actual_assets"

          draft_assets="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$draft_assets"
          (
            cd expected-release
            sha256sum --check --strict SHA256SUMS
          )
          diff -u expected-release/SHA256SUMS "$draft_assets/SHA256SUMS"
          (
            cd "$draft_assets"
            sha256sum --check --strict SHA256SUMS
          )
          for asset in \
            LICENSE \
            THIRD_PARTY_NOTICES.md \
            picker-linux-arm64 \
            picker-linux-x64 \
            picker-macos-arm64 \
            picker-windows-arm64.exe \
            picker-windows-x64.exe; do
            cmp --silent "expected-release/$asset" "$draft_assets/$asset"
          done

          tag_ref="refs/tags/$GITHUB_REF_NAME"
          peeled_ref="${tag_ref}^{}"
          remote_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          remote_refs="$(git ls-remote "$remote_url" "$tag_ref" "$peeled_ref")"
          direct_count="$(printf '%s\n' "$remote_refs" |
            awk -v ref="$tag_ref" '$2 == ref { count++ } END { print count + 0 }')"
          peeled_count="$(printf '%s\n' "$remote_refs" |
            awk -v ref="$peeled_ref" '$2 == ref { count++ } END { print count + 0 }')"
          if [ "$direct_count" -ne 1 ] || [ "$peeled_count" -gt 1 ]; then
            echo "Remote release tag $tag_ref is missing or ambiguous" >&2
            exit 1
          fi
          direct_sha="$(printf '%s\n' "$remote_refs" |
            awk -v ref="$tag_ref" '$2 == ref { print $1 }')"
          resolved_sha="$direct_sha"
          if [ "$peeled_count" -eq 1 ]; then
            resolved_sha="$(printf '%s\n' "$remote_refs" |
              awk -v ref="$peeled_ref" '$2 == ref { print $1 }')"
          fi
          if [ "$resolved_sha" != "$GITHUB_SHA" ]; then
            echo "Remote release tag resolves to $resolved_sha, expected $GITHUB_SHA" >&2
            exit 1
          fi

          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$release_notes" \
            --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
