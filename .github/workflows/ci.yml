name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - run: bun install --frozen-lockfile
      - run: bun install --cwd picker --frozen-lockfile
      - run: bun audit
      - run: bun audit --cwd picker
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file picker/src-tauri/Cargo.lock
      - name: Verify generated third-party notices
        run: |
          cargo install cargo-about --version 0.9.1 --locked --features cli
          cargo fetch --locked --manifest-path picker/src-tauri/Cargo.toml
          bun run check:notices

  plugin-tests:
    name: Plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check:coverage

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  node-consumer:
    name: Node ${{ matrix.node }} package consumer
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Exercise exact npm tarball as a Node consumer
        run: node scripts/test-node-consumer.mjs

  opencode-integration:
    name: Real OpenCode integration
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies and tested OpenCode runtime
        run: |
          bun install --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/opencode-runtime" --package-lock=false opencode-ai@1.18.7
      - run: bun run test:opencode
        env:
          OPENCODE_BIN: ${{ runner.temp }}/opencode-runtime/node_modules/.bin/opencode

  picker-build:
    name: Picker build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y util-linux libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev openbox xdotool xvfb
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: picker
      - name: Exercise rendered picker theme and layout
        run: bun run test:picker:rendered
      - run: bun run build:picker
      - run: cargo test --manifest-path picker/src-tauri/Cargo.toml --locked
      - run: bun run build
      - name: Install tested OpenCode runtime
        run: npm install --prefix "$RUNNER_TEMP/opencode-runtime" --package-lock=false opencode-ai@1.18.7
      - name: Exercise ready protocol, native GUI, installed npm package, and real TUI
        shell: bash
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" bash -euo pipefail -c '
            openbox >/tmp/model-dispatch-openbox.log 2>&1 &
            bun run test:picker-ready
            bun run scripts/smoke-native-picker-auto.ts
            bun run test:package:native:opencode
            bun run test:package:native:tui
          '
        env:
          GDK_BACKEND: x11
          MODEL_DISPATCH_TEST_PREBUILT: "1"
          OPENCODE_BIN: ${{ runner.temp }}/opencode-runtime/node_modules/.bin/opencode

  picker-build-arm64:
    name: Picker build (Linux ARM64)
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils file util-linux libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev openbox xdotool xvfb
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - name: Verify native ARM64 toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(bun -e 'process.stdout.write(process.arch)')" = "arm64"
          test "$(node -p 'process.arch')" = "arm64"
          rustc -vV | grep -Fx "host: aarch64-unknown-linux-gnu"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: picker
      - run: bun run build:picker
      - name: Verify native ARM64 picker architecture and linkage
        shell: bash
        run: |
          set -euo pipefail
          picker="dist-picker/picker-linux-arm64"
          test -f "$picker"
          test -x "$picker"
          file "$picker"
          readelf -h "$picker" | grep -E 'Machine:[[:space:]]+AArch64$'
          ldd "$picker" | tee "$RUNNER_TEMP/picker-linux-arm64-ldd.txt"
          ! grep -q "not found" "$RUNNER_TEMP/picker-linux-arm64-ldd.txt"
      - run: cargo test --manifest-path picker/src-tauri/Cargo.toml --locked
      - run: bun run build
      - name: Install tested OpenCode runtime
        run: npm install --prefix "$RUNNER_TEMP/opencode-runtime" --package-lock=false opencode-ai@1.18.7
      - name: Exercise ARM64 ready protocol, native GUI, installed npm package, and real TUI
        shell: bash
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" bash -euo pipefail -c '
            openbox >/tmp/model-dispatch-openbox.log 2>&1 &
            bun run test:picker-ready
            bun run scripts/smoke-native-picker-auto.ts
            bun run test:package:native:opencode
            bun run test:package:native:tui
          '
        env:
          GDK_BACKEND: x11
          MODEL_DISPATCH_TEST_PREBUILT: "1"
          OPENCODE_BIN: ${{ runner.temp }}/opencode-runtime/node_modules/.bin/opencode

  packaging:
    name: Packaging checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check:release-version
      - run: bun run build
      - run: bun run check:packaging
      - run: bun run test:package
      - run: npm pack --dry-run
      - run: |
          set -euo pipefail
          pkg="$(npm pack --silent)"
          tmp="$(mktemp -d)"
          npm install --ignore-scripts --prefix "$tmp" "./$pkg"
